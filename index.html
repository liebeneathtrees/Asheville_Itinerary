ridges. Native azaleas begin blooming in a pink-to-orange cascade up the elevation gradient.<br/><strong>Early Summer (June–July):</strong> <em>Catawba rhododendron</em> (Rhododendron catawbiense) turns Craggy Gardens entirely magenta — one of the great botanical spectacles of the eastern US. Mountain laurel blooms throughout. Flame azalea (a shocking orange) peaks at 4,000–5,000 ft.<br/><strong>Late Summer (Aug–Sept):</strong> Joe-Pye weed, bee balm, and New York ironweed in the meadows. The heath balds above 5,500 ft — covered in low-growing blueberry, huckleberry, sand myrtle, and Labrador tea — turn copper and burgundy.<br/><strong>Fall (Oct–Nov):</strong> The beech-birch forest canopy on the Parkway turns gold before the oaks go scarlet. The spruce-fir transition zone at Craggy is a completely different ecosystem — mossy, misty, primeval-feeling.<br/><strong>Plants to identify:</strong> Fraser fir (Abies fraseri — endemic to the southern Appalachians, smells like Christmas); red spruce; yellow birch; mountain ash (orange berries in fall); wood sorrel (tiny white flower, shamrock leaves, edible).</p>","folded":true},{"kind":"hike","title":"Parkway Hikes — Choose Your Afternoon","html":"<ul> <li><strong><a href=\"https://www.nps.gov/blri/planyourvisit/craggy-gardens.htm\">Craggy Gardens — Milepost 364</a></strong> (recommended) — 4.6-mi return hike through dense Catawba rhododendron tunnels to a 360° summit at 5,892 ft. In June–July the bloom is overwhelming. The heath bald at the top is a completely different ecosystem from the forest below — windswept, low-growing, with extraordinary views into Tennessee on clear days.</li> <li><strong>Rough Ridge — Milepost 302</strong> (shorter option) — 0.9 mi to exposed granite summit; one of the most dramatic views-per-effort ratios on the entire Parkway. The rock scramble near the top adds a fun technical element. About 45 minutes from Asheville.</li> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/max-patch-loop\">Max Patch</a></strong> (half-day extension, 1 hr west) — 4,629-ft bald with 360° Appalachian panorama; the single most dramatic short hike in western NC. Arrive before 8am on weekends. The Appalachian Trail crosses the summit.</li> <li><strong>Skinny Dip Falls — Milepost 417</strong> — 10-minute walk from the parking lot to a gorgeous natural swimming hole with a small waterfall. Cold mountain water even in August; popular with locals who know about it. Arrive early or after 4pm on summer weekends.</li> </ul>","folded":false},{"kind":"waterfall-brp","title":"Waterfall Stops ON the Blue Ridge Parkway","html":"<ul> <li><strong><a href=\"https://www.nps.gov/blri/planyourvisit/crabtree-falls.htm\">Crabtree Falls — Milepost 339</a></strong> (Moderate · 2.5 mi loop) — The only waterfall trail directly accessible from a Blue Ridge Parkway trailhead in North Carolina. The 60-ft fall sits in a stunning hemlock cove reached via a loop that descends 900 ft into the valley. Crabtree Meadows recreation area has a picnic area and seasonal campground. About 1 hour northeast of Asheville on the Parkway — plan it into a northern Parkway drive day heading toward Linville Falls. Do not confuse with the Crabtree Falls in Virginia (a different waterfall).</li> <li><strong>Glassmine Falls Overlook — Milepost 361</strong> (Easy · overlook only) — A 800-ft+ cascade visible across the Shut-In Creek valley from the Parkway overlook; one of the tallest waterfalls in North Carolina, rarely visited because there is no trail — only the overlook. Best after significant rainfall when the full flow is visible. Often mistaken for a smear on the hillside in dry weather; spectacular after a storm.</li> <li><strong>Skinny Dip Falls — Milepost 417</strong> (Easy · 0.4 mi RT) — Already in the main Day 3 content; worth repeating here as the best Parkway swimming hole. Cold mountain water year-round; small waterfall feeds a rocky pool. Arrive before 10am on summer weekends.</li> </ul>","folded":true},{"kind":"dining","title":"Dining — Day 2","html":"<br/><em>Lunch:</em> Pack a picnic from the Grove Arcade or WNC Farmers Market — every Parkway overlook is a picnic table. Eating above the clouds is better than any restaurant. <br/><em>Alt lunch (heading north):</em> <strong><a href=\"https://www.weavervillemilling.com/\">Weaverville Milling Company</a></strong> — Farm-to-fork dinner in a restored 1880s grist mill on Reems Creek, 20 min north of Asheville. One of the most atmospheric restaurant settings in western NC; seasonal menu driven by what arrives from neighboring farms. <br/><em>After Craggy/post-hike:</em> Return to Asheville for <strong>Twisted Laurel</strong> (elevated pub food, rooftop bar) or <strong>Gan Shan Station</strong> (James Beard–nominated Southeast Asian).","folded":false}],"title":"Blue Ridge Parkway and the NC Arboretum","dayKey":"3"},{"id":"ch4","label":"Chapter 4","badges":["Black Mountain","Swannanoa Valley","White Horse"],"blocks":[{"kind":"intro","title":"","html":"<p><strong>Black Mountain</strong> (20 min east of Asheville on I-40) is what Asheville was 25 years ago — unhurried, genuinely local, quietly extraordinary. The Swannanoa Valley that cradles it connects several small communities with deep Appalachian roots and a thriving arts presence. <strong>Swannanoa</strong> itself sits between Asheville and Black Mountain — stop here first at the <a href=\"https://www.swannanoavalleymuseum.org/\">Swannanoa Valley Museum</a> for the cultural grounding the rest of the day rewards. Then spend the afternoon in Black Mountain proper, ending with an evening show at <strong>White Horse Black Mountain</strong> — one of the finest small music venues anywhere.</p>","folded":false},{"kind":"folk","title":"Arts + Culture — Black Mountain + Swannanoa","html":"<ul> <li><strong><a href=\"https://www.swannanoavalleymuseum.org/\">Swannanoa Valley Museum &amp; History Center</a></strong> — Genuinely excellent small local museum tracing Cherokee heritage, the arrival of Scots-Irish settlers, the railroad, and the remarkable cultural legacy of Black Mountain College. The oral history recordings of elderly craftspeople and mountain musicians are deeply moving. Stop here first.</li> <li><strong><a href=\"https://olddepotartcenter.org/\">Old Depot Art Center</a></strong> — Regional art exhibitions and working studios in the 1910 Black Mountain train depot. The building alone is worth the stop; the exhibitions highlight western NC artists across all media.</li> <li><strong><a href=\"https://www.sevensistersgallery.com/\">Seven Sisters Gallery</a></strong> — Long-established cooperative gallery of regional artists: paintings, prints, photography, ceramics, and handmade jewelry. Genuinely curated, reasonably priced, and locally owned — exactly the right place to buy something to take home.</li> <li><strong>Black Mountain downtown stroll</strong> — State Street and Cherry Street; indie coffee houses, vintage shops, a genuinely good used bookshop (<strong>Swannanoa Valley Books</strong>), and locals who will tell you where to go next. The pace is noticeably different from Asheville.</li> </ul>","folded":false},{"kind":"hike","title":"Hike Options Near Black Mountain","html":"<ul> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/bearwallow-mountain-trail\">Bearwallow Mountain Trail</a></strong> — The best hike in the Black Mountain orbit. 5.8-mile round trip from Cane Creek Rd (20 min east); 1,700 ft of gain to a wide-open grassy bald grazed by horses. 360° views of the Black Mountains, Balsam Range, and Pisgah Ridge. Less crowded than any Parkway trailhead. Allow 3–4 hours.</li> <li><strong>Lake Tomahawk Park</strong> (Black Mountain) — Easy 1-mile walking loop around a pretty mountain lake; picnic area, ducks, a small beach. Perfect low-key morning or between stops.</li> <li><strong>Lookout Mountain Trail</strong> (Black Mountain) — Short 1.5-mi trail to a fire tower above Black Mountain; excellent views of the Swannanoa Valley; trailhead just outside town.</li> <li><strong>Rattlesnake Lodge Trail</strong> (Milepost 374, BRP) — 4-mi round trip to ruins of a 1900s summer estate; stone walls and cisterns emerging from the forest; wonderful historical strangeness on a less-visited Parkway trail.</li> </ul>","folded":false},{"kind":"brewery","title":"Pisgah Brewing Company (Black Mountain)","html":"<p><strong><a href=\"https://www.pisgahbrewing.com/\">Pisgah Brewing</a></strong> is one of the foundational Asheville-area craft breweries and the most entertaining place to drink in the Black Mountain orbit. The 10-acre campus includes a main taproom, a massive outdoor stage and beer garden, and food trucks rotating daily. Live music most Thursday–Saturday evenings in warm months — often nationally touring acts at accessible ticket prices. Dogs welcome everywhere outside. Their <em>Pisgah Pale</em> and <em>Solstice</em> IPA are benchmarks of the regional style.</p> <p>If the timing works out, catching a show here in the late afternoon before heading to White Horse for the evening is an exceptional double-header day for live music.</p>","folded":false},{"kind":"music","title":"White Horse Black Mountain — Tonight","html":"<p><strong><a href=\"https://www.whitehorsebm.com/\">White Horse Black Mountain</a></strong> is one of the finest small music venues in the American South — a 200-capacity listening room that books national-level folk, Americana, bluegrass, and acoustic roots acts in an intimate setting where every seat is a good seat. The sound system is exceptional. The food and beer menu is locally sourced and genuinely good.</p> <p>Check the calendar before the trip and buy tickets in advance — shows regularly sell out, and the booking is consistently excellent. Arriving a few minutes early secures the best seats. This is a sit-and-listen room, not a dance bar — the community treats it with the reverence it deserves.</p> <p><strong>Getting there:</strong> White Horse is at 105 Montreat Rd in Black Mountain, walking distance from the downtown restaurants and galleries. No parking stress.</p>","folded":false},{"kind":"waterfall-blackmtn","title":"Waterfalls Near the Black Mountains + Mount Mitchell","html":"<p>The Black Mountains and Celo Valley hide some of the least-visited waterfalls in western NC — none require long drives from Black Mountain town, and all can be combined with a Bearwallow hike or Pisgah Brewing afternoon.</p> <ul> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/roaring-fork-falls-trail\">Roaring Fork Falls</a></strong> (Easy · 0.4 mi RT) — One of the most beautiful easy-access waterfalls in western NC: a gorgeous 60-ft plunge in a hemlock cove near Burnsville in the Pisgah National Forest. The trailhead is off Roaring Fork Rd (NC-80 corridor, about 45 min from Black Mountain). Frequently overlooked by visitors focused on the Pisgah corridor — almost always uncrowded.</li> <li><strong>Setrock Creek Falls</strong> (Easy · 1.2 mi RT) — A multi-tiered cascade near the Black Mountains Campground (Pisgah NF); the path follows Setrock Creek through old-growth forest; easy enough for any fitness level; often combined with a Mount Mitchell visit since it's on the same road corridor.</li> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/douglas-falls-trail\">Douglas Falls</a></strong> (Moderate · 3.0 mi RT) — A 70-ft waterfall in a pristine hemlock gorge near Celo, NC — one of the most beautiful and most undervisited backcountry falls in the Black Mountains area. The gorge below the falls has the feel of a temperate rainforest. Pisgah NF access off USFS-472.</li> <li><strong>Mitchell Falls</strong> (Easy-Moderate · 1.5 mi RT) — A series of cascades on Setrock Creek closer to the Mount Mitchell summit area; combines naturally with a summit visit. Verify trail access conditions — some trails in this corridor were affected by Hurricane Helene in 2024.</li> <li><strong><a href=\"https://www.nps.gov/blri/planyourvisit/crabtree-falls.htm\">Crabtree Falls — Milepost 339</a></strong> (Moderate · 2.5 mi loop) — Also mentioned in the Parkway day; noted here because it's just 30 min north of Black Mountain on the Parkway. If doing the Black Mountains corridor, this is a natural add-on heading north.</li> </ul>","folded":true},{"kind":"mead-bm","title":"Meaderies + Cider in Black Mountain","html":"<p>Black Mountain has a quietly impressive honey-wine and cider scene alongside its breweries — worth adding to the afternoon rotation.</p> <ul> <li><strong><a href=\"http://www.blackmountainciderworks.com/\">Black Mountain Ciderworks + Meadery</a></strong> — The cornerstone of Black Mountain's craft fermentation scene. Small-batch cider and draft mead made from local apples and regional honey; 10 rotating taps; never filtered or pasteurized; no added sugars or concentrates. The mead program includes coffee, almond, and pistachio variants alongside traditional honey wine. Located around the corner from Pisgah Brewing — a natural double-stop for an afternoon in Black Mountain.</li> <li><strong><a href=\"https://www.alchemyherbalwine.com/\">Alchemy Herbal Wine (Alchemy Black Mountain)</a></strong> — Unique herb, spice, and botanical-infused meads made in small batches; fairly widely distributed in the region so you may have seen bottles elsewhere. The taproom in Black Mountain is the best place to taste the full range — ginger, lavender, elderflower, and seasonal botanical combinations that don't exist anywhere else in western NC. <strong>Verify hours</strong> before visiting.</li> </ul>","folded":true},{"kind":"dining","title":"Dining — Day 3","html":"<br/><em>Breakfast:</em> <strong>Dripolator Coffeehouse</strong> (Black Mountain) — the most beloved coffee shop in the Swannanoa Valley; excellent pour-overs, baked goods, and a front porch that locals treat as a community living room. <br/><em>Lunch:</em> <strong>Red Rocker Inn</strong> — Southern farm-to-table lunch on a rocking-chair porch in a beautifully restored inn. Legendary fried chicken, pimento cheese, and sweet tea. Or <strong>Black Mountain Ale House</strong> for excellent pub food and local drafts. <br/><em>Pre-show dinner:</em> <strong>Berliner Kindl</strong> (German beer and food in Black Mountain — excellent sausages, schnitzel, and a great beer list) or <strong>Veranda Restaurant</strong> (comfort food, right near White Horse).","folded":false}],"title":"Black Mountain and the Swannanoa Valley","dayKey":"4"},{"id":"ch5","label":"Chapter 5","badges":["Waterfall Deep Dive","Pisgah + DuPont"],"blocks":[{"kind":"intro","title":"","html":"<p>Western North Carolina receives up to 80 inches of rainfall per year — more than anywhere in the eastern US outside the Florida panhandle — and all of that water falls off ancient mountains. The result is a landscape dense with waterfalls, from roadside spectacles to remote cascades requiring a full-day hike. Today you'll cover the essential Pisgah circuit plus options to reach three genuinely different waterfall experiences in DuPont State Forest and the Old Fort corridor. Overcast or even light rain days are actually better for waterfall photography — richer color, no harsh shadows, more dramatic flow.</p>","folded":false},{"kind":"hike","title":"The Pisgah Core Circuit (Morning)","html":"<ol> <li><strong><a href=\"https://www.fs.usda.gov/recarea/nfsnc/recarea/?recid=48921\">Looking Glass Falls</a></strong> — 60-ft free-fall into a wide plunge pool; one of the most photographed waterfalls in NC and completely accessible from the roadside. A stone path leads to the base. Go here first, before 9am, for the best light and fewest people. Free entry; $5 parking.</li> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/moore-cove-falls-trail\">Moore Cove Falls</a></strong> (Hidden gem) — 1.4-mi easy round trip through old-growth tulip poplar and hemlock to a delicate 50-ft curtain waterfall you can walk directly behind. Almost always uncrowded even when Sliding Rock is packed. The forest here is some of the most beautiful in Pisgah.</li> <li><strong><a href=\"https://www.fs.usda.gov/recarea/nfsnc/recarea/?recid=48934\">Sliding Rock</a></strong> — A natural 60-ft water slide on Looking Glass Creek with 11,000 gallons of 50°F mountain water per minute. Lifeguards on duty May–Labor Day. $5 entry; wear water shoes. Arrive before 10am on summer weekends or after 4pm when the crowds thin. Pure joy.</li> <li><strong><a href=\"https://www.nps.gov/blri/planyourvisit/graveyard-fields.htm\">Graveyard Fields Loop — Milepost 418</a></strong> — 2.2-mi loop to two waterfalls through an ancient spruce-fir bog ecosystem. Upper Falls (easy, 10 min flat walk) and Lower Yellowstone Falls (60 ft, 30-min loop). The open, otherworldly landscape of this valley — logged and then burned in 1925, now recovering — is unlike anything else on the Parkway.</li> </ol>","folded":false},{"kind":"waterfall-ext","title":"Hidden Gems: Courthouse Falls + Catawba Falls (add one of these)","html":"<p><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/courthouse-falls-trail\">Courthouse Falls</a></strong> (35.256°N 82.926°W, near Rosman — 30 min south of Brevard) — A secret among waterfall hunters: a 45-ft circular plunge pool surrounded by sheer granite walls, accessible via a 1-mi easy trail through old-growth rhododendron. Almost zero tourist traffic even on busy weekends. The pool walls create perfect acoustics — the roar is enormous. Drive Forest Road 140B off NC-215; 4WD not required in dry conditions.<br/><br/><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/catawba-falls-trail\">Catawba Falls</a></strong> (35.639°N 82.086°W, near Old Fort — 45 min east of Asheville, completely different direction) — A strikingly different experience: a 2.2-mi out-and-back through a hemlock gorge to a dramatic 100-ft multi-tier fall. Old Fort is a small historic railroad town with excellent character; the <strong>McDowell Arts Council</strong> gallery and the <strong>Andrews Geyser</strong> (a pressurized water display in a railroad park, oddly wonderful) are worth adding. <strong>Hickory Nut Gorge Brewing</strong> in Old Fort is excellent.</p>","folded":true},{"kind":"waterfall-ext2","title":"Alternative Day: DuPont State Forest (Hunger Games waterfalls + flat walking)","html":"<p><strong><a href=\"https://dupontforest.com/\">DuPont State Recreational Forest</a></strong> (35 min south near Brevard) is a completely different waterfall experience — gently rolling old-growth beech and tulip poplar forest, wide well-maintained trails, and three spectacular waterfalls accessible in a single easy loop.<br/><br/><strong>Hooker Falls + Triple Falls + High Falls Loop</strong> (3.3 miles, easy–moderate): Hooker Falls (12-ft wide cascade), Triple Falls (three-tier drop filmed in <em>The Hunger Games</em> and <em>The Last of the Mohicans</em>), and the dramatic 120-ft High Falls. All within 2 miles of each other on flat to moderate terrain — accessible for any fitness level.<br/><br/>DuPont also has exceptional mountain biking (50+ miles of trail), granite dome rock climbing, and a large system of equestrian trails. The forest feels completely different from Pisgah — softer, more pastoral, more gentle — which makes it an excellent complement if you did Pisgah earlier in the trip.</p>","folded":true},{"kind":"waterfall-highlands","title":"Highlands / Cashiers Plateau + Gorges State Park — A Full Southern Circuit","html":"<p>The Highlands Plateau and Gorges State Park corridor, 45–70 minutes south of Asheville, contains one of the densest concentrations of waterfalls anywhere in the eastern United States. This makes an excellent full-day alternative to the Pisgah core circuit — particularly for anyone who has already done Looking Glass and Sliding Rock.</p> <p><strong>The Highlands Road Waterfalls (US-64 between Franklin and Highlands):</strong></p> <ul> <li><strong><a href=\"https://www.fs.usda.gov/recarea/nfsnc/recarea/?recid=48915\">Dry Falls</a></strong> (Easy · 0.2 mi RT) — Walk behind a 65-ft waterfall without getting wet. Off US-64 west of Highlands; signed parking area; genuinely dramatic.</li> <li><strong>Bridal Veil Falls (Highlands)</strong> (Easy · roadside/drive-under) — Drive your car under the waterfall. The old US-64 roadbed passes beneath the flow. Seasonal. 2 miles from Dry Falls — do both.</li> <li><strong>Cullasaja Falls</strong> (Easy · roadside viewpoint) — A 200-ft cascade visible from the US-64 roadside pullout in the Cullasaja Gorge; one of the most powerful roadside falls in the Southeast.</li> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/glen-falls-trail\">Glen Falls</a></strong> (Moderate · 2.0 mi RT) — Three-tier fall system totaling nearly 60 ft south of Highlands in the Blue Valley; Nantahala National Forest; less visited.</li> <li><strong><a href=\"https://www.fs.usda.gov/recarea/nfsnc/recarea/?recid=48948\">Upper Whitewater Falls</a></strong> (Easy · 0.4 mi RT to overlook) — The highest waterfall east of the Rocky Mountains at 411 ft. A short walk from the NC-281 trailhead brings you to an overlook above the SC border. The scale is genuinely humbling.</li> </ul> <p><strong>Gorges State Park + Horsepasture Wild and Scenic River:</strong></p> <ul> <li><strong>Turtle Back Falls</strong> (Moderate · 2.0 mi RT) — Natural granite slides and swimming holes on the Horsepasture River; a fun, accessible introduction to the Gorges corridor.</li> <li><strong>Bust Your Butt Falls</strong> (Moderate · 3.2 mi RT) — A slippery slide waterfall on the Horsepasture; the name is an accurate warning. Combine with Turtle Back on the same trail.</li> <li><strong>Bearwallow Falls</strong> (Strenuous · 4.4 mi RT) — 50-ft cascade further up the Horsepasture corridor; river crossings required.</li> <li><strong><a href=\"https://www.ncparks.gov/gorges-state-park\">Rainbow Falls</a></strong> (Strenuous · 5.4 mi RT, 1,400 ft descent) — The crown jewel of Gorges State Park: a 150-ft plunge into a remote gorge. The 1,400-ft descent to the Horsepasture River gorge means 1,400 ft back out — plan 4–5 hours, bring trekking poles, and never attempt in wet conditions. One of the most dramatic waterfall hikes in the eastern United States.</li> </ul> <p><strong><a href=\"https://www.pearsonsfalls.com/\">Pearson's Falls</a></strong> (Easy · 0.6 mi RT) — A 90-ft waterfall in a private botanical preserve near Saluda, NC; $5 entry; remarkable old-growth gorge with rare plant communities documented since the 1800s. One of the most botanically diverse small preserves in NC — the mosses, liverworts, and ferns lining the gorge walls are as impressive as the waterfall. Combine with <strong>Shunkawauken Falls</strong> (Easy · 0.3 mi RT) nearby in Columbus/Tryon — a 200-ft multi-tier cascade near the Thermal Belt foothills that almost no one knows about.</p>","folded":true},{"kind":"waterfall-panthertown","title":"Panthertown Valley — The Yosemite of the East (Full Backcountry Day)","html":"<p><strong>Panthertown Valley</strong> is a remarkable wilderness plateau in Jackson County — 6,300 acres of open granite domes, heath balds, and clear mountain streams at 3,700–4,600 ft elevation. It's been called the \"Yosemite of the East\" for its exposed rock slabs and sweeping views. The valley contains at least a dozen named waterfalls, most requiring 4–7 miles of hiking to reach. This is a full-day backcountry commitment, not a casual stop.</p> <p><strong>Main trailhead:</strong> Cold Mountain Rd off NC-281, near Cashiers NC — about 1.5 hrs from Asheville. No facilities, no services, no cell signal. Bring a paper map (the Nantahala National Forest Panthertown Valley map) and topo awareness.</p> <ul> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/schoolhouse-falls-trail\">Schoolhouse Falls</a></strong> (Moderate · 4.0 mi RT) — The most accessible Panthertown waterfall; a 30-ft slide-and-plunge into a gorgeous turquoise pool. The best entry point for Panthertown first-timers. Swim here, then explore further if energy allows.</li> <li><strong>Discovery Falls + Greenland Creek Falls</strong> (Moderate · 4.0–4.5 mi RT) — Two cascades reachable on a longer loop from the main trailhead; reasonable full-day circuit with Schoolhouse Falls.</li> <li><strong>Grassy Falls + Log Hollow Falls + Wilderness Falls + Frolictown Falls</strong> (Strenuous · 5.5–6.5 mi RT each) — The deeper Panthertown waterfalls require route-finding across the open granite domes; GPS or topo strongly recommended. The solitude is extraordinary — you may not see another hiker all day.</li> </ul> <p><strong>Conditions note:</strong> Panthertown trails are maintained by volunteers (Panthertown Valley Backcountry Users Association). Conditions vary seasonally. Check current trail reports on <a href=\"https://www.alltrails.com/us/north-carolina/cashiers\">AllTrails Cashiers</a> before going.</p>","folded":true},{"kind":"waterfall-pisgah-extended","title":"Extended Pisgah: More Falls Beyond the Core Circuit","html":"<p>Once you've done the core Pisgah circuit (Looking Glass, Sliding Rock, Moore Cove, Graveyard Fields), these additions extend the day or fill a return visit with equally rewarding destinations.</p> <ul> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/daniel-ridge-loop\">Daniel Ridge Falls (Tom Springs Falls)</a></strong> (Moderate · 3.2 mi RT) — A beautiful 60-ft fan waterfall on Daniel Ridge in Pisgah NF; the loop trail passes through impressive old-growth poplars; one of Pisgah's most scenic backcountry waterfalls and significantly less visited than the roadside cluster.</li> <li><strong>Wintergreen Falls</strong> (Easy · 1.4 mi RT) — A lovely 20-ft tiered cascade near the Moore Cove trailhead area; swimming pool at the base; combine with Moore Cove Falls on the same morning.</li> <li><strong>Second Falls — West Fork Pigeon River</strong> (Easy · 0.8 mi RT) — A distinct cascade downstream from the Graveyard Fields loop; most visitors miss it entirely. Accessible from a short path near the Graveyard Fields parking area — ask a ranger.</li> <li><strong>Sunburst Falls</strong> (Moderate · 2.0 mi RT) — Scenic cascade on the West Fork Pigeon River at the historic Sunburst logging community site in Haywood County; the old-growth forest fragments here are magnificent.</li> <li><strong>Key Falls</strong> (Moderate · 2.5 mi RT) — A 60-ft waterfall on Key Creek in Pisgah NF, Transylvania County; quiet trail, rarely visited. Verify current conditions.</li> <li><strong>Slick Rock Falls</strong> (Moderate · 3.4 mi RT) — A broad 60-ft curtain fall with an excellent swimming pool; reached via the Slick Rock trail from NC-215 south of Sunburst; solitude almost guaranteed.</li> <li><strong>Grogan Creek Falls</strong> (Moderate · 4.0 mi RT) — Part of the Pisgah Art Loeb trail system; beautiful cascade in the Davidson River corridor; less visited than the main Pisgah falls cluster.</li> <li><strong>Bubbling Spring Branch Cascades</strong> (Strenuous · 4.5 mi RT) — A series of cascades in the Shining Rock Wilderness; wilderness rules apply. Day-use only for most visitors; significant route-finding required.</li> </ul> <p><strong>McDowell County Falls (45 min east — near Catawba Falls):</strong></p> <ul> <li><strong>Little Bradley Falls</strong> (Moderate · 3.2 mi RT) and <strong>Big Bradley Falls</strong> (Moderate · 3.6 mi RT) — Beautiful companion waterfalls on Avery's Creek in Pisgah NF; Big Bradley is a dramatic 60-ft plunge with a natural pool; combine for a 4.5-mi loop. About 40 min from Asheville near the I-26 corridor.</li> <li><strong>Upper Creek Falls</strong> (Moderate · 3.6 mi RT) — A 60-ft waterfall in the Wilson Creek/Brown Mountain area of Caldwell/Burke County; combine with the South Harper Creek Falls trail for a full High Country waterfall day.</li> <li><strong>Tom's Creek Falls</strong> (Easy · 0.4 mi RT) — A lovely 60-ft waterfall near Marion; pairs naturally with Catawba Falls and Keeper's Cut Meadery for a full McDowell County day.</li> </ul>","folded":true},{"kind":"mead-d5","title":"Keeper's Cut Meadery — Marion NC (45 min east; the finest meadery in western NC)","html":"<p><strong><a href=\"https://keeperscut.com/\">Keeper's Cut Meadery</a></strong> is in Marion, NC — the McDowell County seat about 45 minutes east of Asheville, close to the Catawba Falls trailhead. It occupies a beautifully renovated space in Marion's historic downtown depot district and is widely considered the best meadery in western North Carolina.</p> <p>Owner Charlie produces both still wine-style meads and carbonated session meads on-site; flights include an educational walk through mead history from ancient China and Ethiopia through Norse culture and Appalachian honey traditions. The knowledgeable staff are genuinely passionate — budget extra time because the conversations tend to run long. <strong>Highly recommended as a waterfall-day add-on</strong> if you're already heading to Catawba Falls (Old Fort is right there). Also near <strong>Sidetracked Brewery</strong> and the <strong>McDowell Arts Council Gallery</strong> for a full Old Fort afternoon.</p>","folded":true},{"kind":"dining","title":"Dining — Day 4","html":"<br/><em>Pre-hike:</em> Grab pastries from any Asheville bakery before heading out. No food services in Pisgah itself. <br/><em>Lunch in Brevard:</em> <strong>The Square Root</strong> (farm-to-table in a Victorian storefront; great salads and sandwiches) or <strong>Rocky's Grill &amp; Soda Shop</strong> (classic 1950s American diner, beloved locally). <br/><em>Post-hike beer:</em> <strong><a href=\"https://www.brevardbrewing.com/\">Brevard Brewing Company</a></strong> — Serious craft lagers and ales in a relaxed downtown Brevard taproom; patio with mountain views; dogs welcome. <br/><em>Alt post-hike:</em> <strong><a href=\"https://www.pisgahbrewing.com/\">Pisgah Brewing Co</a></strong> (Black Mountain, on the drive back) — outdoor stage, beer garden, food trucks, frequently live music.","folded":false}],"title":"Waterfalls of Pisgah and DuPont","dayKey":"5"},{"id":"ch6","label":"Chapter 6","badges":["Beer City USA","River Arts District","Live Music"],"blocks":[{"kind":"intro","title":"","html":"<p>Asheville has more craft breweries per capita than any other American city — 50+ operations in a city of 90,000. Today pairs the brewery trail with the <strong>River Arts District</strong> — 22 converted industrial buildings along the French Broad River where 200+ working artists have studios. The RAD and the South Slope brewery district are walkable to each other; the day flows naturally from studio-crawl to taproom to taproom. End with live music wherever the calendar takes you.</p>","folded":false},{"kind":"highlights","title":"River Arts District — Morning (10am–1pm)","html":"<p>Studios are open most days 10am–4pm — confirm at <a href=\"https://www.riverartsdistrict.com/\">riverartsdistrict.com</a>. Walk the full stretch of Riverside Drive; the buildings have directories at the entrance.</p> <ul> <li><strong>North Carolina Glass Center</strong> — Watch glassblowers at work; glass-blowing classes available same-day if space opens up.</li> <li><strong>Jonas Gerard Fine Art</strong> — Huge abstract canvases created by literally dancing, rolling, and spinning on the painting surface. Watching him work is a performance.</li> <li><strong>Curve Studios</strong> — One of the largest studio buildings; ceramics, printmaking, and fiber studios on multiple floors.</li> <li><strong><a href=\"https://www.wedgebrewing.com/\">Wedge Brewing</a></strong> — The original RAD brewery in a converted railroad iron foundry. 16 taps; industrial-chic patio on the river. Best RAD lunch anchor — get here before noon to claim patio space.</li> <li><strong><a href=\"https://www.12bones.com/\">12 Bones Smokehouse</a></strong> — Obama ate here twice. Open Tue–Fri lunch only; slow-smoked BBQ; jalapeño grits, blueberry–chipotle sauce. Arrive by 11am or there is a wait.</li> </ul>","folded":false},{"kind":"brewery","title":"The Full Brewery Trail — South Slope + Beyond","html":"<p>All of the following are within a 10-minute walk of each other on the South Slope.</p> <ul> <li><strong><a href=\"https://burialbeers.com/\">Burial Beer Co</a></strong> — Norse mythology meets Appalachian ritual. Nationally acclaimed; extraordinary quality across every style. The <em>Skillet Donut Stout</em>, <em>Surf Wax IPA</em>, and rotating wild ales are essential. Beautiful industrial taproom with a secret back patio. <em>Do not skip.</em></li> <li><strong><a href=\"https://bhramaribrewing.com/\">Bhramari Brewing</a></strong> — Named for the bee goddess; exceptional lager program and farmhouse ales in a lovingly restored historic building. Less famous nationally than it deserves. Their <em>The Most Interesting Lager in the World</em> is exactly that.</li> <li><strong><a href=\"https://hiwirebrewing.com/\">Hi-Wire Brewing</a></strong> — Big Top circus theme; reliably excellent lagers, hazy IPAs, and fruited sours. Strong rotating food truck lineup. The most accessible of the South Slope breweries for first-timers.</li> <li><strong><a href=\"https://wickedweedbrewing.com/\">Wicked Weed + Funkatorium</a></strong> — The downtown flagship is excellent; but the <strong>Funkatorium</strong> (sour bar and barrel hall, two blocks away) is one of the most distinctive drinking experiences in the American South. Open Thu–Sun. The wild ale and sour program is among the best in the country.</li> <li><strong><a href=\"https://highlandbrewing.com/\">Highland Brewing</a></strong> — Asheville original (1994); rooftop bar with sweeping Blue Ridge views; frequent live music on the roof in summer. The <em>Gaelic Ale</em> is a 30-year benchmark of the regional style.</li> <li><strong><a href=\"https://www.catawbabrewing.com/\">Catawba Brewing</a></strong> — Well-loved AVL brewery with a great taproom on South Slope and a particular strength in sour and fruited ales; the <em>White Zombie White Ale</em> is a local standard.</li> <li><strong>Ginger's Revenge</strong> — Probably the only craft <em>ginger beer</em> brewery in the Southeast. House-brewed alcoholic ginger beer in a small South Slope taproom; ginger heat levels from mild to genuinely alarming. A genuinely singular Asheville experience.</li> <li><strong><a href=\"https://asheville.com/breweries/asheville-brewing-company/\">Asheville Brewing Company</a></strong> — Craft brewery inside a second-run movie theater; order pints and pizza at your seat. The intersection of beer and cinema is pure Asheville logic.</li> </ul>","folded":false},{"kind":"brewery-farther","title":"Worth the Drive: Sierra Nevada + New Belgium (10-min south)","html":"<p><strong><a href=\"https://sierranevada.com/brewery/north-carolina/\">Sierra Nevada Brewing</a></strong> — The Chico, CA craft-beer institution built its East Coast home in Asheville. A stunning eco-brewery with 360° mountain views; 30+ taps; free brewery tours; and an outdoor amphitheater hosting major touring acts in summer. The tour is among the best in the Southeast for scale and commitment to sustainable brewing.<br/><br/><strong><a href=\"https://www.newbelgium.com/brewery/asheville/\">New Belgium Brewing</a></strong> — 100% employee-owned, wind-powered brewery right on the French Broad River. Excellent river-view taproom, the <em>Fire Garden</em> outdoor gathering space, and genuinely interesting sustainability tours. Both are within 3 miles of downtown.</p>","folded":true},{"kind":"brewery-avl-expanded","title":"More Asheville Taprooms: The Full Tap Map","html":"<ul> <li><strong><a href=\"https://www.greenmanbrewery.com/\">Green Man Brewery</a></strong> (South Slope) — one of Asheville's original craft breweries; English ales + rotating IPAs; two-level taproom with rooftop deck.</li> <li><strong><a href=\"https://www.twinleafbrewery.com/\">Twin Leaf Brewery</a></strong> (South Slope) — consistently excellent quality; strong lager program; dog-friendly patio.</li> <li><strong><a href=\"https://www.oneworldbrewing.com/\">One World Brewing</a></strong> (downtown basement) — eclectic experimental program; one of the most distinctive atmospheres in AVL — small, intimate, unpredictable.</li> <li><strong><a href=\"https://www.monkpub.com/\">Thirsty Monk</a></strong> (downtown) — two levels: upstairs American craft, downstairs all-Belgian bar with Trappist imports + house Belgian ales. The Belgian downstairs is a gem.</li> <li><strong>French Broad River Brewing</strong> (North Lexington Ave) — rotating craft + pizza; great late-night option.</li> <li><strong><a href=\"https://www.sweetencreekbrewing.com/\">Sweeten Creek Brewing</a></strong> (South Asheville) — community-focused; rotating IPAs and lagers; solid food program.</li> <li><strong><a href=\"https://hillmanbeer.com/\">Hillman Beer</a></strong> (downtown) — hand-crafted small-batch; intimate taproom; rotating seasonals.</li> <li><strong><a href=\"https://www.archetypebrewing.com/\">Archetype Brewing</a></strong> (West AVL + downtown) — community-driven; creative names; strong lager program; the West AVL taproom is especially relaxed.</li> <li><strong><a href=\"https://www.dssolvr.com/\">DSSOLVR</a></strong> (South Slope) — Asheville's most critically acclaimed experimental brewery; wild ales, mixed fermentation, boundary-pushing styles. Essential stop for serious beer travelers.</li> <li><strong>Eurisko Beer Co.</strong> (South Slope) — creative craft; solid IPAs + sours; neighborhood taproom feel.</li> <li><strong><a href=\"https://www.cellarestbeer.com/\">Cellarest Beer Project</a></strong> (South Slope) — nationally recognized Belgian-inspired + mixed-fermentation ales; one of Asheville's most exciting newer breweries.</li> <li><strong><a href=\"https://www.zillicoah.com/\">Zillicoah Beer Company</a></strong> (Woodfin, 10 min north) — outdoor patio directly on the French Broad River; excellent lager program; most scenic brewery setting in the region.</li> <li><strong><a href=\"https://upcountrybrewing.com/\">UpCountry Brewing</a></strong> (downtown) — family-friendly; good food menu; accessible for any palate in the group.</li> <li><strong><a href=\"https://www.whitelabs.com/brewing-taproom\">White Labs Brewing Co.</a></strong> (downtown) — the world's leading yeast company's taproom; taste identical beers brewed with different yeast strains side-by-side. Most uniquely educational beer experience in Asheville.</li> <li><strong>Diatribe Brewing Co. / Outsider Brewing / Riverside Rhapsody Beer Co.</strong> (South Slope area) — rotating small-batch programs; <strong>verify current hours</strong> for all three.</li> </ul>","folded":true},{"kind":"brewery-surrounding","title":"Surrounding Region Breweries (30–75 min from Asheville)","html":"<p><strong>30–45 min — South + West:</strong> <a href=\"https://www.millsriverbrewery.com/\">Mills River Brewing</a> (Mills River) · <a href=\"https://blueghostbrewing.com/\">Blue Ghost Brewing</a> (Arden) · <a href=\"https://boldrock.com/mills-river/\">Bold Rock Hard Cider</a> (Mills River) · <a href=\"https://www.oklawaha.com/\">Oklawaha Brewing</a>, Southern Appalachian Brewery + <a href=\"https://www.sanctuarybrewing.com/\">Sanctuary Brewing</a> (all Hendersonville, great combo day) · <a href=\"https://www.lookoutbrewing.com/\">Lookout Brewing</a> (Black Mountain — ideal after Bearwallow Mountain hike) · <a href=\"https://oskarblues.com/location/brevard/\">Oskar Blues</a>, Ecusta Brewing + Guidon Brewing (all Brevard area — natural Pisgah-day finishers; <strong>verify hours</strong> for Ecusta + Guidon).</p> <p><strong>45–75 min — West + SW:</strong> <a href=\"https://www.nantahalabrewing.com/\">Nantahala Brewing</a> (Bryson City — nationally acclaimed; pair with NOC rafting on the Nantahala) · <a href=\"https://www.boojumbrewing.com/\">Boojum Brewing</a> (Waynesville) · <a href=\"https://www.bearwatersbrewing.com/\">Bearwaters Brewing</a> (Canton) · Noblebräu Brewing (Waynesville area — <strong>verify</strong>) · <a href=\"https://www.lazyhikerbrewing.com/\">Lazy Hiker</a> (Franklin) · <a href=\"https://www.7clansbrewing.com/\">7 Clans</a> + Kituwah Brewing (Cherokee — Eastern Band of Cherokee Nation owned, culturally significant) · Lake Lure Brewery + Hickory Nut Gorge Brewery (Chimney Rock area — <strong>verify seasonal hours</strong>) · Balsam Falls Brewing (Sylva — <strong>verify</strong>).</p> <p><strong>Destination day trip (1+ hr):</strong> <a href=\"https://fontaflora.com/\">Fonta Flora Brewery</a> (Morganton, 1 hr east) — one of the most important craft breweries in the Southeast; farm-to-glass with NC-grown ingredients; award-winning sours + mixed fermentation. Combine with Brown Mountain Bottleworks next door. Sidetracked Brewery (Old Fort, 45 min east — pair with Catawba Falls; <strong>verify hours</strong>).</p> <p><strong>High Country (1.5 hrs NE — a different direction but excellent):</strong> <a href=\"https://www.booneshinebeer.com/\">Booneshine Brewing</a> · <a href=\"https://www.appalachianmountainbrewery.com/\">Appalachian Mountain Brewery</a> · <a href=\"https://www.lostprovince.com/\">Lost Province Brewing</a> (all Boone) · Blowing Rock Brewing (Blowing Rock). These are best on a dedicated High Country trip.</p>","folded":true},{"kind":"mead-avl","title":"Meaderies + Cider in the Asheville Orbit","html":"<p>Western NC has a growing mead scene that pairs naturally with the brewery culture — many visitors do a beer-and-mead circuit across the same afternoon. All of these are within 45 minutes of downtown Asheville.</p> <ul> <li><strong><a href=\"https://www.noblecider.com/\">Noble Cider &amp; Mead</a></strong> (Asheville, River Arts District / North AVL) — One of the best cideries in the Southeast; small-batch cider and mead made from locally grown NC apples and regional honey. The taproom is a natural complement to a River Arts District day — the dry ciders especially are exceptional. Draft and canned options available to-go.</li> <li><strong><a href=\"https://pointlookoutvineyards.com/\">Point Lookout Vineyards / World's Edge Meadery</a></strong> (Hendersonville, 30 min south) — Vineyard and meadery on the Blue Ridge escarpment south of Asheville; the 'World's Edge' mead label reflects the dramatic elevation drop of the mountain front; wine and mead tastings with views. <strong>Verify hours.</strong></li> <li><strong><a href=\"http://www.blackmountainciderworks.com/\">Black Mountain Ciderworks + Meadery</a></strong> (Black Mountain, 20 min east) — Also covered in the Black Mountain day; included here for those doing a same-day cider detour. The coffee mead and pistachio mead are particularly distinctive.</li> <li><strong><a href=\"https://www.alchemyherbalwine.com/\">Alchemy Herbal Wine</a></strong> (Black Mountain) — Botanical mead; herb, spice, and flower-infused honey wines unlike anything else in the region. <strong>Verify taproom hours.</strong></li> </ul>","folded":true},{"kind":"music","title":"Evening — Live Music Options","html":"<ul> <li><strong>Salvage Station</strong> — Outdoor riverside venue on the French Broad; eclectic booking across rock, hip-hop, folk, and EDM; food trucks and fire pits; the most atmospheric outdoor venue in AVL.</li> <li><strong>Rabbit Rabbit</strong> — New outdoor amphitheater (3,500 cap); nationally touring acts in a great setting; check calendar for big shows.</li> <li><strong>Highland Brewing Rooftop</strong> — Free outdoor music many summer evenings; bring a beer and watch the mountains go purple at sunset.</li> <li><strong>Orange Peel</strong> — If there is a headliner tonight, this is where to be.</li> </ul>","folded":false}],"title":"Beer City and the River Arts District","dayKey":"6"},{"id":"ch7","label":"Chapter 7","badges":["Marshall","Hot Springs","French Broad River"],"blocks":[{"kind":"intro","title":"","html":"<p>The <strong>French Broad River corridor</strong> northwest of Asheville is the most undervisited and most rewarding day-trip direction from the city. <strong>Marshall</strong> (40 min northwest) is a tiny Madison County town draped along the river — arguably the most characterful small town in western NC, with almost no tourist infrastructure but enormous depth. <strong>Hot Springs</strong> (25 min further) is an Appalachian Trail village where the trail runs right through the main street and natural geothermal springs surface at the French Broad's edge. Both reward slow wandering and unhurried conversation with the people you meet.</p>","folded":false},{"kind":"highlights","title":"Marshall, NC — Morning","html":"<p>Madison County is one of the least-changed counties in Appalachia — ballad-singing traditions, old-time fiddle music, and hand-crafted dulcimers are still living practices here, not museum exhibits. Marshall (pop. ~800) is the county seat and it looks and feels like 1955, in the best way.</p> <ul> <li><strong><a href=\"https://www.bluffmountaininstruments.com/\">Bluff Mountain Instruments</a></strong> — A small shop of handmade and vintage folk instruments: dulcimers, banjos, fiddles, mandolins, and flat-top guitars. The owner can tell you exactly who made each instrument and where. If you play anything stringed, you will not leave empty-handed. Check hours in advance — closed some weekdays.</li> <li><strong>Marshall Deli + Market</strong> — The community gathering point; fresh sandwiches, local produce, and coffee from a genuinely beloved local institution. The conversations you overhear are worth the trip alone.</li> <li><strong>Madison County courthouse square</strong> — A complete small Appalachian town square that has barely changed in decades; the hardware store, the barber, the old bank building. Walk along the river on Main Street.</li> <li><strong>French Broad River walk</strong> — Marshall sits in a tight river bend; the French Broad surrounds it on three sides. Walk the river's edge; in summer you can swim from the rocks below the bridge.</li> </ul>","folded":false},{"kind":"wellness","title":"Hot Springs, NC — Afternoon","html":"<p><strong>Hot Springs</strong> (pop. ~600) is one of only two places in the United States where the Appalachian Trail runs directly through a town's main street. Natural geothermal springs — 100–104°F — surface here at the edge of the French Broad River, a genuine geological oddity in the Appalachians.</p> <ul> <li><strong><a href=\"https://www.nchotsprings.com/\">Hot Springs Resort &amp; Spa</a></strong> — Private soaking pools fed by geothermal springs; 50-minute sessions in wooden tubs on the riverbank. Reserve ahead on weekends. Open until midnight — an evening soak with stars overhead is extraordinary. The mineral content is certified; the water genuinely feels different from a heated pool.</li> <li><strong>Appalachian Trail through town</strong> — The white blazes appear on the sidewalk; thru-hikers in various states of grime and euphoria are a constant presence. The AT crosses the French Broad on the footbridge just above the resort.</li> <li><strong><a href=\"https://www.noc.com/hot-springs\">NOC French Broad Rafting</a></strong> — Half-day float or white-water trips through the Appalachian gorge (Class II–III); the most scenic stretch of the French Broad; reserve the day before.</li> <li><strong>Lovers Leap Trail</strong> — Easy 2.5-mi loop from the edge of town to a dramatic cliff overlooking the French Broad gorge; the Mountain-to-Sea Trail passes through. Quick and deeply worthwhile.</li> </ul>","folded":false},{"kind":"alt","title":"Alternative: Chimney Rock + Lake Lure (different direction — southeast)","html":"<p><strong><a href=\"https://www.ncparks.gov/chimney-rock-state-park\">Chimney Rock State Park</a></strong> (45 min SE) — A 315-ft granite monolith with an elevator inside; 75-mile views from the summit; Hickory Nut Falls (404 ft — one of the tallest in the eastern US) accessible via a 1.5-mi round trip. Filmed location for <em>The Last of the Mohicans</em>.<br/><br/><strong><a href=\"https://www.lakelure.com/\">Lake Lure</a></strong> (5 min from Chimney Rock) — The <em>Dirty Dancing</em> filming location; 1927 man-made mountain lake; boat rentals, kayaking, and beach swimming at Morse Park.<br/><br/>Combine these two for a full southeastern day, very different terrain and vibe from the northwestern French Broad corridor.</p>","folded":true},{"kind":"waterfall-hotsprings","title":"French Broad Falls (Bird Rock Falls) — Near Hot Springs NC","html":"<p><strong>French Broad Falls</strong> (also called Bird Rock Falls) (Moderate · 1.5 mi RT) — A powerful cascade on the French Broad River accessible via a trail near Hot Springs, NC. The French Broad runs fast and clear through the Appalachian gorge here; the falls drop into a broad pool used as a swimming hole by local thru-hikers and area residents. Combines naturally with the Hot Springs mineral soaking pools for a complete river-and-falls morning. Verify current trail access conditions — portions of the French Broad corridor were affected by Hurricane Helene in 2024.</p> <p>Also worth noting: the <strong>Lovers Leap Trail</strong> above Hot Springs (2.5 mi loop, already in the main Hot Springs section) follows the Appalachian Trail to a dramatic cliff overlook above the French Broad gorge — the river and its rapids are visible far below in a way that puts the waterfall stops in geographic context.</p>","folded":true},{"kind":"mead-d7","title":"Fae Nectar — Lake Lure NC (if taking the Chimney Rock alternative)","html":"<p>If you're doing the Chimney Rock / Lake Lure alternative on this day rather than Marshall + Hot Springs, <strong><a href=\"https://faenectar.com/\">Fae Nectar</a></strong> in Lake Lure is unmissable — and frankly one of the most singular experiences in this entire planner.</p> <p>Fae Nectar is a craft meadery set inside a genuine medieval tavern: dark-stained timber beams, a double-sided stone hearth, candlelight, mead served from the tap or in drinking horns, a Celtic Kitchen serving hearty comfort food, and a Great Hall that hosts world-class live acoustic music. The back deck overlooks the Blue Ridge Mountains. They also run immersive fantasy events and have become a wedding and event destination.</p> <p>It is unusual. It is committed. It is absolutely worth stopping for a mead flight and a look around even if you're just driving through Lake Lure. Check their <a href=\"https://faenectar.com/\">events calendar</a> before you go — a live music evening here is extraordinary.</p>","folded":true},{"kind":"dining","title":"Dining — Day 6","html":"<br/><em>Breakfast (Weaverville, on the way):</em> <strong>Well-Bred Bakery</strong> — Artisan sourdough, pastries, and excellent coffee; much-loved by locals; Weaverville main street, 20 min north of Asheville. Or stop at the <strong>Weaverville Milling Company</strong> if open for lunch. <br/><em>Lunch (Marshall):</em> Marshall Deli — unpretentious, local, essential. The specials board changes daily. <br/><em>Dinner (Hot Springs or return):</em> <strong>Spring Creek Tavern</strong> (Hot Springs) — beloved by AT thru-hikers and locals; friendly, casual, great burgers and local beer. Or return to Asheville for a final dinner at <strong><a href=\"https://www.theadmiralasheville.com/\">The Admiral</a></strong> — West Asheville's finest, elevated American, wine-forward, intimate.","folded":false}],"title":"Marshall, Hot Springs, and the French Broad","dayKey":"7"},{"id":"ch8","label":"Chapter 8","badges":["Vinyl + Records","Plants","West AVL + Depart"],"blocks":[{"kind":"intro","title":"","html":"<p>Final morning in West Asheville — the neighborhood that is most authentically the city's own. The bohemian corridor along <strong>Haywood Road</strong> is where working musicians, artists, and longtime residents live and gather. Today is for record stores, plants, one last excellent breakfast, and a slow departure through a neighborhood that rewards the unhurried. AVL airport is 25 minutes from West Asheville — allow time.</p>","folded":false},{"kind":"records","title":"Record Stores — The Asheville Vinyl Circuit","html":"<ul> <li><strong><a href=\"https://www.harvestrecords.net/\">Harvest Records</a></strong> (West Asheville, Haywood Rd) — The anchor of Asheville's vinyl culture and one of the best independent record stores in the Southeast. Carefully curated selection across folk, Appalachian, old-time, bluegrass, rock, soul, jazz, and experimental. Staff picks are consistently excellent. The in-store listening setup is exceptional — ask to hear anything before you buy. This is the store that reflects the soul of Asheville music. Plan 45–60 minutes.</li> <li><strong><a href=\"https://www.staticagerecords.com/\">Static Age Records</a></strong> (downtown, Lexington Ave) — The darker, weirder sibling to Harvest. Indie, punk, metal, noise, post-rock, and outsider music in a beautifully cluttered space. If Harvest is the warm fireplace, Static Age is the underground — both are essential Asheville. Open daily.</li> <li><strong>Orbit DVD</strong> (downtown) — Mostly films but with a good record section; the kind of curated video store that no longer exists anywhere else. Film-and-music nerd paradise.</li> </ul>","folded":false},{"kind":"plants","title":"Plants — Nurseries + Botanical Stops","html":"<ul> <li><strong><a href=\"https://www.frenchbroadfoodcoop.com/\">French Broad Food Co-op</a></strong> (West Asheville) — Worker-owned organic grocery and local food hub. A remarkable cross-section of what Asheville grows: local herbs, edible plants, seasonal produce from named farms, and a bulk section of medicinal and culinary herbs. The community bulletin board is a social document of West Asheville life.</li> <li><strong>Appalachian Nurseries</strong> — Native plant nursery specialising in Appalachian wildflowers, ferns, and woodland plants. If you want to take a piece of the mountain ecosystem home — trillium, bloodroot, wild ginger, native azalea, Virginia bluebells — this is the correct source. Open seasonally; call ahead.</li> <li><strong>West Asheville Tailgate Market</strong> (Saturday mornings, Haywood Rd) — The real local farmers market: small-scale vegetable growers, herb farmers, native plant vendors, honey producers, and handmade craft. Completely distinct from the larger WNC Farmers Market; much more community-focused.</li> <li><strong>Grovewood Village gardens</strong> (if not done Day 1) — The grounds of the 1920s Biltmore Industries complex include formal gardens with heritage plantings; free to walk through any time the studios are open.</li> </ul>","folded":false},{"kind":"highlights","title":"West Asheville Morning — Haywood Road","html":"<ul> <li><strong><a href=\"https://www.biscuitheads.com/\">Biscuit Head</a></strong> — Cat-head biscuits (fist-sized) with a legendary gravy bar (10 rotating gravies) and 10+ house-made jams. The locals' breakfast institution. Expect a short wait — it moves fast.</li> <li><strong><a href=\"https://www.sunnypointcafe.com/\">Sunny Point Café</a></strong> — Farm-to-table breakfast in a garden patio; house-made everything; great green chile scramble and biscuits. The longer, more relaxed breakfast option.</li> <li><strong>Haywood Road stroll</strong> — Vintage Moon (excellent vintage clothing), Revolve Clothing Exchange, the record stores above, independent coffee houses, and local murals. The pace is slower than downtown and the experience more genuine.</li> <li><strong>Double Crown</strong> (West Asheville) — Country and honky-tonk bar with excellent jukebox; opens afternoons; the most fun you can have before noon if you make the right choices.</li> </ul>","folded":false},{"kind":"departure","title":"Departure Notes + Last Stops","html":"<p><strong>Asheville Regional Airport (AVL)</strong> — 10 miles south; 25 minutes from West Asheville, 20 from downtown. Small, relaxed terminal — 90 minutes ahead of a domestic flight is comfortable. Car rentals at the terminal itself.<br/><br/><strong>One last beer:</strong> <a href=\"https://www.lexavebrew.com/\">Lexington Avenue Brewery</a> (LAB) downtown has a rooftop bar and solid pizza — perfect send-off stop near the highway on-ramp.<br/><br/><strong>Take-home provisions:</strong> Earth Fare or Whole Foods (Tunnel Rd, 5 min from I-240) for Asheville-made products to bring home: Highland Brewing cans, Burial Beer mixed packs, French Broad Chocolate bars, local hot sauces, Sourwood honey. Or head back to Harvest Records for one more pass through the bins.<br/><br/><strong>Driving out:</strong> I-26 east toward Charlotte or I-40 east toward the Piedmont. The Swannanoa Valley on I-40 offers final views of the Black Mountains — a fitting goodbye to a mountain landscape unlike anywhere else in the eastern US.</p>","folded":true}],"title":"West Asheville records, plants, and heading home","dayKey":"8"},{"id":"ch9","label":"Extended","badges":["High Country Waterfalls","Linville + Elk River"],"blocks":[{"kind":"intro","title":"","html":"<p>These waterfalls are northeast of Asheville in the High Country — 1.5–2 hours away and in a completely different direction from the main itinerary. They're best treated as a dedicated day trip or a stop on the drive home if heading toward Charlotte or the Piedmont. The quality is extraordinary; Linville Falls alone is worth the detour for the right traveler.</p>","folded":false},{"kind":"waterfall-highcountry","title":"High Country NC — Waterfall Destinations","html":"<ul> <li><strong><a href=\"https://www.nps.gov/blri/planyourvisit/linville-falls.htm\">Linville Falls — BRP Milepost 316</a></strong> (Easy-Moderate · 1.6 mi RT to main overlook) — One of the most photographed waterfalls in the Blue Ridge: Linville River drops 90 ft over the gorge rim into a 2,000-ft deep Linville Gorge Wilderness below. Multiple overlook trails give different perspectives of the upper and lower falls; the Erwin's View trail (2.0 mi RT) offers the most dramatic angle. Visitor center on-site. About 1.5 hrs NE of Asheville via BRP or US-221.</li> <li><strong><a href=\"https://www.alltrails.com/trail/us/north-carolina/elk-river-falls\">Elk River Falls — Avery County NC</a></strong> (Easy · 0.4 mi RT) — A 50-ft plunge waterfall on the Elk River near Elk Park; popular swimming hole; easy short trail from the roadside parking area. Near Banner Elk and Beech Mountain in the High Country. Combine with Linville Falls for a full High Country waterfall day.</li> <li><strong>South Harper Creek Falls</strong> (Strenuous · 5.4 mi RT) — A 50-ft plunge into one of the finest backcountry swimming holes in NC, in the Wilson Creek corridor of Caldwell/Burke County. A full-day backcountry commitment but the pool at the base is extraordinary.</li> <li><strong>Big Bear Falls</strong> (Strenuous · 4.0 mi RT) — Remote 50-ft waterfall in the Pisgah backcountry of the High Country; solitude guaranteed; verify trail conditions on AllTrails before going.</li> </ul>","folded":false}],"title":"High Country waterfalls: Linville and Elk River","dayKey":null}],"links":[{"label":"AVL Weather","url":"https://forecast.weather.gov/MapClick.php?CityName=Asheville&state=NC&site=RAH&textField1=35.5951&textField2=-82.5515"},{"label":"Blue Ridge Pkwy Status","url":"https://www.nps.gov/blri/planyourvisit/conditions.htm"},{"label":"AllTrails Asheville","url":"https://www.alltrails.com/us/north-carolina/asheville"},{"label":"NC Waterfalls Guide","url":"https://www.romanticasheville.com/waterfalls.htm"},{"label":"Folk Art Center","url":"https://southernhighlandguild.org/folk-art-center/"},{"label":"NC Arboretum","url":"https://www.ncarboretum.org/"},{"label":"Events Calendar","url":"https://www.exploreasheville.com/events/"},{"label":"Parkway Map PDF","url":"https://www.nps.gov/blri/planyourvisit/maps.htm"},{"label":"NC Mea }

function addTourPicks(tr, someday) {
  const ids = [...tourPicks(tr)].filter(id => !whereInTrip(id));
  if (!ids.length) return;
  const fresh = !trip(); const t = ensureTrip();
  let day = -1;
  if (!someday) {
    // A brand-new trip starts with an empty Day 1: use it rather than adding Day 2.
    if (fresh && t.days.length === 1 && !t.days[0].items.length) t.days[0].title = tr.title;
    else t.days.push({ id: uid(), title: tr.title, note: '', items: [] });
    day = t.days.length - 1;
  }
  ids.forEach(id => addToDay(id, day));
  delete ui.tourPicks[tr.id];
  persist(); refreshAll(); renderGuide();
  toast(someday ? `Saved ${ids.length} for Someday in ${t.name}` : `Added ${ids.length} places as Day ${day + 1} of ${t.name}`);
}

function exportTrip() {
  const t = trip(); if (!t) { toast('Start a trip first, then export it'); return; }
  const blob = new Blob([JSON.stringify({ app: CONFIG.appName, version: 1, trip: t }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (t.name || 'trip').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Trip exported');
}
$('#import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const { trip: nt, dropped } = normalizeTrip(obj && obj.trip);
    store.trips[nt.id] = nt; store.current = nt.id; persist(); refreshAll(); showTab('trip');
    toast(`Imported "${nt.name}"` + (dropped ? `; ${dropped} unknown ${dropped === 1 ? 'place was' : 'places were'} skipped` : ''));
  } catch (err) { toast("That file isn't a trip from this planner."); }
});

// ---------- trips from files and links ----------
// Checks and copies a trip that came from outside (an import or a share link): unknown places are
// skipped, text is trimmed, and everything gets fresh ids so it can't collide with your trips.
function normalizeTrip(raw) {
  if (!raw || !Array.isArray(raw.days)) throw new Error('not a trip');
  const places = (Array.isArray(raw.places) ? raw.places : [])
    .filter(p => p && isFinite(p.lat) && isFinite(p.lng) && Math.abs(p.lat) <= 90 && Math.abs(p.lng) <= 180).slice(0, 200)
    .map(p => ({ old: p.id, id: 'p_' + uid(), name: String(p.name || 'My place').slice(0, 80), note: String(p.note || '').slice(0, 1000), lat: +p.lat, lng: +p.lng }));
  const remap = Object.fromEntries(places.map(p => [p.old, p.id])); places.forEach(p => delete p.old);
  let dropped = 0;
  const clean = list => (Array.isArray(list) ? list : []).map(i => i && (remap[i.stop] || (String(i.stop).startsWith('p_') ? null : liveId(i.stop))))
    .filter(x => { if (!x) dropped++; return !!x; }).map(stop => ({ id: uid(), stop }));
  const trip = { id: uid(), name: String(raw.name || 'Shared trip').slice(0, 80) || 'Shared trip', created: Date.now(),
    days: raw.days.slice(0, 60).map(d => ({ id: uid(), title: String((d && d.title) || '').slice(0, 120), note: String((d && d.note) || '').slice(0, 2000),
      chapter: d && CHAPTERS[d.chapter] ? d.chapter : undefined, ideasDay: d && d.ideasDay && CHAPTERS['ch' + d.ideasDay] ? String(d.ideasDay) : undefined,
      items: clean(d && d.items) })),
    someday: clean(raw.someday), places };
  return { trip, dropped };
}
// Share links carry the whole trip after #trip= as compact JSON in base64url, so nothing is
// uploaded anywhere: the link itself is the trip.
const b64url = {
  enc(str) { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(s) { const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
};
function encodeTrip(t) {
  const r5 = x => Math.round(x * 1e5) / 1e5;
  const ids = list => list.map(i => i.stop);
  return b64url.enc(JSON.stringify({ v: 1, n: t.name,
    d: t.days.map(d => [d.title || '', d.note || '', d.chapter || 0, d.ideasDay || 0, ids(d.items)]),
    s: ids(t.someday), p: t.places.map(p => [p.id, p.name, r5(p.lat), r5(p.lng), p.note || '']) }));
}
function decodeTrip(code) {
  const o = JSON.parse(b64url.dec(code));
  if (!o || o.v !== 1 || !Array.isArray(o.d)) throw new Error('bad link');
  const items = list => (Array.isArray(list) ? list : []).map(stop => ({ stop }));
  return { name: o.n, someday: items(o.s),
    days: o.d.map(d => ({ title: d[0], note: d[1], chapter: d[2] || undefined, ideasDay: d[3] || undefined, items: items(d[4]) })),
    places: (Array.isArray(o.p) ? o.p : []).map(p => ({ id: p[0], name: p[1], lat: p[2], lng: p[3], note: p[4] })) };
}
async function shareTrip() {
  const t = trip(); if (!t) return;
  if (location.protocol === 'file:') { toast('Share links need the hosted version. From a saved file, use Export in More instead.'); return; }
  const url = location.origin + location.pathname + '#trip=' + encodeTrip(t);
  const text = `${t.name}: a ${t.days.length}-day ${DATA.place.name} trip`;
  try {
    if (navigator.share) { await navigator.share({ title: t.name, text, url }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied. Paste it into a message to share your trip.'); }
  catch (e) { window.prompt('Copy this link to share your trip:', url); }
}
function sharedBoxHtml() {
  const r = ui.shared; if (!r) return '';
  const n = r.days.reduce((k, d) => k + d.items.length, 0) + r.someday.length;
  return `<div class="shared-box"><h3>${esc(r.name || 'A shared trip')}</h3>
    <p>Someone shared this trip with you: ${r.days.length} ${r.days.length === 1 ? 'day' : 'days'}, ${n} ${n === 1 ? 'place' : 'places'}. Adding it makes your own copy to change however you like.</p>
    <div class="btn-row"><button class="btn primary" data-shared="add">${icon('plus')}Add to my trips</button><button class="btn quiet" data-shared="no">No thanks</button></div></div>`;
}
function readShareLink() {
  const m = location.hash.match(/^#trip=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  try { ui.shared = decodeTrip(m[1]); }
  catch (e) { toast("That share link looks incomplete. Ask for it again, or use an exported file."); }
  history.replaceState(null, '', location.pathname + location.search);
}

// ---------- offline: the service worker and saved maps ----------
const offline = { supported: 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'),
  status: null, busy: false, done: 0, total: 0, failed: 0 };
function swAsk(msg, onMessage) {
  return new Promise(resolve => {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!sw) { resolve(null); return; }
    const ch = new MessageChannel();
    ch.port1.onmessage = e => { if (onMessage) onMessage(e.data); if (!onMessage || /^(DONE|CLEARED|STATUS|PAGE_SAVED)$/.test(e.data.type)) resolve(e.data); };
    sw.postMessage(msg, [ch.port2]);
  });
}
async function refreshOfflineStatus() {
  if (!offline.supported) return;
  offline.status = await swAsk({ type: 'STATUS' });
  renderOffline();
}
function renderOffline() {
  const el = $('#offline-area'); if (!el) return;
  if (!offline.supported) {
    el.innerHTML = `<div class="offline-status">${icon('wifi-off')}<div><b>Offline mode needs the hosted planner</b>
      <span>${location.protocol === 'file:' ? 'This is a saved copy opened as a file.' : 'This browser doesn\'t support it.'} Open the planner from its web address to save it and your maps for use without signal.</span></div></div>`;
    return;
  }
  const st = offline.status;
  const ready = st && st.pageSaved;
  const n = st ? st.tileCount : 0;
  el.innerHTML = `<div class="offline-status${ready ? ' ready' : ''}">${icon(ready ? 'check' : 'wifi-off')}<div>
      <b>${ready ? 'The planner works offline on this device' : 'Getting ready for offline use...'}</b>
      <span>${ready ? `Your trips, every place card, and the guide work with no signal. ${n ? n.toLocaleString() + ' map tiles saved.' : 'Save maps below so the map shows too.'}` : 'Keep this open for a moment with a connection.'}</span></div></div>
    ${(() => { const t = trip(); return t && tripCount(t)
      ? `<div class="btn-row"><button class="btn primary" id="off-trip"${offline.busy ? ' disabled' : ''}>${icon('download')}Save maps for ${esc(t.name)}</button>
      <button class="btn" id="off-screen"${offline.busy ? ' disabled' : ''}>${icon('map')}Save the map on screen</button></div>`
      : `<p class="trip-meta" style="margin:8px 0">${t ? 'Add places to your trip to save maps for its route.' : 'Once your trip has places, you can save maps for its route here.'}</p>
      <div class="btn-row"><button class="btn" id="off-screen"${offline.busy ? ' disabled' : ''}>${icon('map')}Save the map on screen</button></div>`; })()}
    <div class="progress"${offline.busy || offline.total ? '' : ' hidden'}><div style="width:${offline.total ? Math.round(100 * offline.done / offline.total) : 0}%"></div></div>
    <p class="progress-label" id="off-label">${offline.busy ? `Saving map tiles: ${offline.done} of ${offline.total}` : (offline.total ? `Saved ${offline.total - offline.failed} of ${offline.total} map tiles${offline.failed ? ` (${offline.failed} couldn't be reached; try again with a better signal)` : ''}.` : '')}</p>
    ${n ? `<button class="btn small quiet danger" id="off-clear">${icon('trash')}Clear saved maps</button>` : ''}`;
}
// Tile addresses exactly as the map asks for them, for the base map on screen (same server letter).
function tileUrl(z, x, y) {
  const d = baseDef(); const subs = d.subdomains || 'abc';
  return d.url.replace('{s}', subs[Math.abs(x + y) % subs.length]).replace('{z}', z).replace('{x}', x).replace('{y}', y).replace('{r}', '');
}
const nativeZoom = z => Math.min(z, baseDef().maxZoom);
function tilesInBounds(bounds, z) {
  const nw = map.project(bounds.getNorthWest(), z).divideBy(256).floor();
  const se = map.project(bounds.getSouthEast(), z).divideBy(256).floor();
  const out = [];
  for (let x = nw.x; x <= se.x; x++) for (let y = nw.y; y <= se.y; y++) out.push(tileUrl(z, x, y));
  return out;
}
function tilesAround(ll, z, r) {
  const c = map.project(L.latLng(ll.lat, ll.lng), z).divideBy(256).floor();
  const out = [];
  for (let x = c.x - r; x <= c.x + r; x++) for (let y = c.y - r; y <= c.y + r; y++) out.push(tileUrl(z, x, y));
  return out;
}
const MAX_SAVE = 1000;   // matches MAX_REQUEST_TILES in sw.js
function tripTileUrls(t) {
  const pts = [...t.days.flatMap(d => d.items), ...t.someday].map(i => S(i.stop)).filter(Boolean);
  if (!pts.length) return [];
  const urls = new Set();
  const b = L.latLngBounds(pts.map(s => [s.lat, s.lng])).pad(0.1);
  for (let z = 9; z <= 11; z++) tilesInBounds(b, nativeZoom(z)).forEach(u => urls.add(u));      // the whole route
  pts.forEach(s => { tilesAround(s, nativeZoom(13), 1).forEach(u => urls.add(u)); tilesAround(s, nativeZoom(15), 1).forEach(u => urls.add(u)); });  // around each stop
  return [...urls];
}
async function saveTiles(urls, what) {
  if (!offline.supported) { toast('Saving maps needs the hosted planner.'); return; }
  if (!navigator.serviceWorker.controller) { toast('Offline mode is still getting ready. Try again in a moment.'); return; }
  if (urls.length > MAX_SAVE) { toast(`That's ${urls.length.toLocaleString()} map tiles, more than ${MAX_SAVE.toLocaleString()} at once. Zoom in, or save part of the trip.`); return; }
  offline.busy = true; offline.done = 0; offline.total = urls.length; offline.failed = 0; renderOffline();
  await swAsk({ type: 'CACHE_TILES', urls }, m => {
    if (m.type === 'PROGRESS' || m.type === 'DONE') { offline.done = m.done; offline.total = m.total; offline.failed = m.failed; }
    const bar = $('#offline-area .progress > div'), lab = $('#off-label');
    if (bar) bar.style.width = (m.total ? Math.round(100 * m.done / m.total) : 100) + '%';
    if (lab && m.type === 'PROGRESS') lab.textContent = `Saving map tiles: ${m.done} of ${m.total}`;
  });
  offline.busy = false;
  toast(offline.failed ? `Saved ${what}, except ${offline.failed} tiles that couldn't be reached` : `Saved ${what} for offline use`);
  refreshOfflineStatus();
}
function saveTripMaps() {
  const t = trip(); if (!t || !tripCount(t)) { toast('Add places to a trip first, then save its maps.'); return; }
  saveTiles(tripTileUrls(t), `${baseDef().label.toLowerCase()} maps for your trip`);
}
function saveScreenMap() {
  const z = map.getZoom();
  if (z < 10) { toast('Zoom in to the area you want first: this view is too wide to save.'); return; }
  const urls = new Set(); for (let k = z; k <= Math.min(z + 2, 16); k++) tilesInBounds(map.getBounds(), nativeZoom(k)).forEach(u => urls.add(u));
  saveTiles([...urls], 'this map area');
}
async function clearMaps() {
  if (!confirm('Clear all saved maps from this device? Your trips are not affected.')) return;
  await swAsk({ type: 'CLEAR_TILES' }); offline.total = 0; toast('Saved maps cleared'); refreshOfflineStatus();
}
if (offline.supported) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    const go = () => swAsk({ type: 'CACHE_PAGE' }).then(refreshOfflineStatus);
    if (navigator.serviceWorker.controller) go();
    else navigator.serviceWorker.addEventListener('controllerchange', go, { once: true });
  }).catch(() => { offline.supported = false; renderOffline(); });
}
window.addEventListener('offline', () => toast("You're offline. Your trips, place cards, and saved maps still work."));
window.addEventListener('online', () => toast('Back online'));

      <li>${GUIDE ? 'The Guide has tours by theme and by region. Open one to show its places on the map, check the ones you want, and add them as a day in your trip.' : 'Each chapter in the Guide can show its places on the map or become a day in your trip.'}</li></ul></div></details>

$('#btn-help').addEventListener('click', () => showTab('help'));

// ---------- tabs and the phone sheet ----------
const panel = $('#panel');
function showTab(tab) {
  if (isWide() && tab === 'map') tab = 'explore';
  ui.tab = tab;
  $$('[role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab || (tab === 'explore' && b.dataset.tab === 'map' && !isWide()))));
  if (tab === 'map') { closePanel(); return; }
  if (!isWide()) closeCard();
  $$('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + tab));
  if (tab === 'guide') renderGuide();
  if (tab === 'help') renderHelp();
  if (tab === 'more') { renderMore(); refreshOfflineStatus(); }
  if (tab === 'trip') renderTrip();
  if (!isWide()) { panel.classList.add('open'); panel.classList.toggle('full', tab === 'guide' || tab === 'help'); }
  $('#panel-body').scrollTop = 0;
}
function closePanel() {
  if (isWide()) return;
  panel.classList.remove('open', 'full');
  $$('.tabbar [role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === 'map')));
  ui.tab = 'map';
}
$$('[role="tab"]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#btn-filters').addEventListener('click', () => showTab('explore'));
$('#btn-filters-top').addEventListener('click', () => { showTab('explore'); setTimeout(() => $('#search').focus(), 300); });
// Sheet handle: tap toggles half and full; swipe up for full, down for half or closed.
(() => {
  const h = $('#panel-handle'); let y0 = null;
  h.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  h.addEventListener('touchmove', e => { if (y0 !== null) e.preventDefault(); }, { passive: false });
  h.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (dy > 50) { if (panel.classList.contains('full')) panel.classList.remove('full'); else closePanel(); }
    else if (dy < -50) panel.classList.add('full');
    else panel.classList.toggle('full');
  });
  h.addEventListener('click', e => { if (e.pointerType === 'mouse' || e.detail === 0) panel.classList.toggle('full'); });
})();
window.addEventListener('resize', () => { map.invalidateSize(); });

function refreshAll() {
  renderTrip(); renderResults(); renderMap();
  if (ui.selected) renderCard();
  if (ui.tour) { const y = $('#panel-body').scrollTop; renderGuide(); $('#panel-body').scrollTop = y; }
  $('#trip-label').textContent = trip() ? trip().name : '';
}

// ---------- start ----------
readShareLink();
renderExplore(); renderGuide(); renderMore(); renderTrip(); renderMap();
showTab(ui.shared ? 'trip' : (isWide() ? 'explore' : 'map'));
window.TripPlanner = { ui, CONFIG, setBaseLayer, allStopIds: () => STOPS.map(s => s.id), get store() { return store; }, openCard, addToDay, showTab, renderMap, refreshAll, encodeTrip, decodeTrip, onFix, addPlaceAt, tripTileUrls, tileUrl, offline };  // for tests
})();
